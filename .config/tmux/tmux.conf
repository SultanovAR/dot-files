# ─────────────────────────────────────────────────────────────────────────────
# tmux.conf — nvim-flavored ergonomics, Ghostty + zsh-vi-mode
# tmux 3.6a
# ─────────────────────────────────────────────────────────────────────────────

# ── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix    # prefix C-a -> literal C-a (beginning-of-line in shell)
bind a   send-prefix    # prefix a   -> same, easier (no Ctrl)

# ── Core ─────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0            # local Ghostty: zero lag on prefix/Esc
set -g focus-events on
setw -g mode-keys vi
setw -g status-keys vi

# ── Status bar off ───────────────────────────────────────────────────────────
set -g status off

# ── Clipboard (OSC 52 — works locally and over SSH, no pbcopy dependency) ────
set -g set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard,xterm-256color:clipboard,tmux-256color:clipboard'
bind -T copy-mode-vi y    send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y    send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ── Copy-mode entry ──────────────────────────────────────────────────────────
bind Escape copy-mode
bind [      copy-mode            # default kept

# Copy-mode motions (vi defaults already cover h/j/k/l, w/b/e, gg/G, /, ?, n/N).
# Reinforce half-page like nvim <C-d>/<C-u>:
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-f send-keys -X page-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line

# Jump between prompts ($ from your PROMPT). Use { and } in copy-mode:
bind -T copy-mode-vi '}' send-keys -X search-forward  '^me@local:'
bind -T copy-mode-vi '{' send-keys -X search-backward '^me@local:'

# ── Direct prefix bindings (flat, no chord table) ────────────────────────────
# Panes
bind v split-window -h -c '#{pane_current_path}'    # vsplit
bind s split-window -v -c '#{pane_current_path}'    # hsplit (overrides choose-tree)
bind V command-prompt -p "vsplit cmd:" "split-window -h -c '#{pane_current_path}' '%%'"
bind S command-prompt -p "hsplit cmd:" "split-window -v -c '#{pane_current_path}' '%%'"
bind d kill-pane                                     # overrides default detach
bind q kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z
bind '=' select-layout tiled
bind o break-pane
bind '<' resize-pane -L 5
bind '>' resize-pane -R 5
bind '-' resize-pane -D 3
bind '+' resize-pane -U 3

# Windows (tabs). Alt-* reserved by AeroSpace -> prefix-only.
bind c new-window -c '#{pane_current_path}'
bind , command-prompt -p "rename window:" "rename-window '%%'"
bind H previous-window
bind L next-window
bind Tab last-window

# Detach (moved off `d` which now kills pane)
bind D detach-client

# ── Reload ───────────────────────────────────────────────────────────────────
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: double-Esc to enter copy-mode (LazyVim t-mode style)
# TRADEOFF: breaks Esc inside TUI apps (nvim, less, htop, fzf) because tmux
# must wait `escape-time` ms to decide if a second Esc follows. Inside nvim a
# single Esc gets delayed; macros and abbreviations misbehave.
# Uncomment ONLY if you accept that:
# bind -n Escape switch-client -T escdouble
# bind -T escdouble Escape copy-mode
# bind -T escdouble q send-keys Escape       # let single Esc through (manual)
# ─────────────────────────────────────────────────────────────────────────────
